# ============================================================================
# sl-cli 主配置文件
# ----------------------------------------------------------------------------
# 完整的命令示例请参考同目录下的 sl-cli.example.yaml。
# 本文件通过 imports 引入示例，按需在下方追加自定义命令即可。
# ============================================================================

# ---- 配置文件查找顺序 -------------------------------------------------------
# sl-cli 启动时按以下顺序查找主配置 (找到第一个即停止):
#   1. --config <path>                       命令行显式指定
#   2. $HOME/.config/sl-cli/sl-cli.yaml      推荐位置 (config init 写入此处)
#   3. ./sl-cli.yaml                         当前工作目录
#   4. $HOME/.sl-cli.yaml                    旧版兼容路径

# ---- 编写规则 ---------------------------------------------------------------
# 1. 顶层字段:
#      imports:  []string         - 引入其它 YAML 文件 (相对路径基于本文件目录)
#      vars:     map[string]string - 全局变量, 模板中通过 {{.vars.KEY}} 引用
#      commands: []Command        - 命令列表
#
# 2. 命令字段:
#      name:        命令名 (必填)
#      usage:       帮助文本中的简短描述
#      type:        http | shell | system  (与 subcommands 二选一)
#      subcommands: 嵌套子命令 (与 type 二选一; 形成命令组)
#
# 3. 类型专属字段:
#      type: http   -> api.url (必填), api.method, api.headers, api.body, api.pipes
#      type: shell  -> script (必填, 多行字符串, 由 /bin/sh -c 执行)
#      type: system -> command (必填), args (基础参数, 用户输入会追加在后)
#
# 4. 模板与变量替换 (适用于 url / body / headers / script / args):
#      {{index .args 0}}     第 N 个命令行参数 (从 0 开始)
#      {{.vars.KEY}}         引用全局 vars
#      ${ENV} / $ENV         环境变量 (模板渲染后再展开)
#      注意: 位置参数必须用 {{index .args N}}, 不能写成 {{.args.N}}
#
# 5. HTTP 管道 (api.pipes):
#      仅当响应状态码为 2xx 时才进入管道; 非 2xx 会直接输出 body 并报错,
#      避免 jq 等命令解析错误页面失败。多个管道按顺序流式串联。
#
# 6. 参数透传:
#      shell / system 类型默认禁用 Cobra 的 flag 解析,
#      因此 `sl-cli ls -la` 中的 -la 会被原样传给底层命令。
#
# 7. 修改本文件后, 务必运行:  sl-cli config check
# ============================================================================

imports:
  - sl-cli.example.yaml

# 在此处追加你自己的全局变量
# vars:
#   my_token: "${MY_API_TOKEN}"

# 在此处追加你自己的命令 (与 imports 中的命令同名时, 子命令会合并到已存在命令下)
commands: []
