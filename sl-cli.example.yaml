# ============================================================================
# sl-cli 示例命令集合
# ----------------------------------------------------------------------------
# 本文件作为参考样例随 `make install` 一起部署到 $HOME/.config/sl-cli/，
# 并由同目录的 sl-cli.yaml 通过顶层 `imports:` 引入；用户主配置只需在
# sl-cli.yaml 中追加自己的命令，无需直接修改本文件。
#
# 如果想停用这些示例命令，编辑 sl-cli.yaml，从 imports 列表中移除本文件。
# 修改后请运行 `sl-cli config check` 验证语法。
# ============================================================================

# ---- 配置拆分：从其它文件导入命令 ------------------------------------------
# 路径相对于当前文件所在目录；支持多级嵌套，自动检测循环导入。
# imports:
#   - commands/git.yaml
#   - commands/k8s.yaml

# ---- 全局变量 -------------------------------------------------------------
# 在模板中通过 {{.vars.KEY}} 引用。
# 变量值本身支持环境变量展开 (${ENV}) 和命令行参数模板 ({{index .args 0}})。
vars:
  api_base: "https://httpbin.org"
  token: "${MY_API_TOKEN}"           # 从环境变量读取
  default_user: "guest"

commands:
  # ==========================================================================
  # 1. HTTP - 最简 GET 请求
  # ==========================================================================
  - name: "ip"
    usage: "查询当前公网 IP"
    type: "http"
    api:
      url: "{{.vars.api_base}}/ip"
      method: "GET"

  # ==========================================================================
  # 2. HTTP - POST + Header + Body (含环境变量与参数模板)
  #    用法: sl-cli echo "Hello"
  # ==========================================================================
  - name: "echo"
    usage: "向 httpbin 发送一条消息 (用法: sl-cli echo <message>)"
    type: "http"
    api:
      url: "{{.vars.api_base}}/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Custom-Header: "sl-cli-client"
        Authorization: "Bearer {{.vars.token}}"
      body: |
        {
          "message": "{{index .args 0}}",
          "user": "{{.vars.default_user}}"
        }

  # ==========================================================================
  # 3. HTTP - 多级管道处理 (response -> jq -> grep -> stdout)
  #    仅当状态码 2xx 时才进入管道，避免 jq 解析错误页报错。
  #    用法: sl-cli weather London
  # ==========================================================================
  - name: "weather"
    usage: "查询城市天气并格式化 (用法: sl-cli weather <city>)"
    type: "http"
    api:
      url: "https://goweather.herokuapp.com/weather/{{index .args 0}}"
      method: "GET"
      pipes:
        - command: "jq"
          args: ["."]
        - command: "grep"
          args: ["temperature"]

  # ==========================================================================
  # 4. Shell - 多行脚本，支持交互式输入
  #    用法: sl-cli greet Mike
  # ==========================================================================
  - name: "greet"
    usage: "Shell 脚本问候 (用法: sl-cli greet [name])"
    type: "shell"
    script: |
      NAME="{{index .args 0}}"
      if [ -z "$NAME" ]; then
        echo "Hello, Stranger!"
      else
        echo "Hello, $NAME!"
      fi
      echo "Current dir: $(pwd)"

  # ==========================================================================
  # 5. System - 系统命令别名 (参数透传)
  #    配置中的 args 是基础参数，命令行追加参数会拼接在后面。
  #    用法: sl-cli ll -h        => 实际执行: ls -l -a -G -h
  # ==========================================================================
  - name: "ll"
    usage: "列出文件详情 (别名 ls -laG)"
    type: "system"
    command: "ls"
    args: ["-l", "-a", "-G"]

  # ==========================================================================
  # 6. System - Git Log 美化别名
  #    用法: sl-cli gl -n 10
  # ==========================================================================
  - name: "gl"
    usage: "优雅的 Git Log"
    type: "system"
    command: "git"
    args: ["log", "--graph", "--oneline", "--decorate", "--all"]

  # ==========================================================================
  # 7. 子命令分组 (subcommands)
  #    用法: sl-cli dev info / sl-cli dev ports
  # ==========================================================================
  - name: "dev"
    usage: "开发者工具集"
    subcommands:
      - name: "info"
        usage: "显示开发环境信息"
        type: "shell"
        script: |
          echo "Go:    $(go version 2>/dev/null || echo 'not installed')"
          echo "Node:  $(node -v 2>/dev/null || echo 'not installed')"
          echo "Shell: $SHELL"

      - name: "ports"
        usage: "列出本机监听端口"
        type: "system"
        command: "lsof"
        args: ["-iTCP", "-sTCP:LISTEN", "-P", "-n"]

  # ==========================================================================
  # 8. 参数动态补全 (completion)
  #    按 TAB 时执行脚本，stdout 每行一个候选，可写成 "值<TAB>描述"。
  #    已输入的参数是脚本的 $1..$n，$# 即当前正在补全第几个参数 (从 0 开始)，
  #    当前正在输入的词在 $SL_CLI_COMP_CUR 中。
  #    调试: sl-cli __complete sw ""
  # ==========================================================================
  - name: "sw"
    usage: "切换 git 分支 (用法: sl-cli sw <branch>)"
    type: "system"
    command: "git"
    args: ["switch"]
    # 简写：直接给一段脚本
    completion: |
      git branch --format='%(refname:short)' 2>/dev/null

  - name: "greet-to"
    usage: "按语言问候 (用法: sl-cli greet-to <lang> <name>)"
    type: "shell"
    script: |
      echo "[{{index .args 0}}] Hello, {{index .args 1}}!"
    # 完整写法
    completion:
      script: |
        case $# in
          0) printf 'zh\t中文\nen\tEnglish\nja\t日本語\n' ;;
          1) printf '{{.vars.default_user}}\nAlice\nBob\n' ;;
        esac
      timeout: 2s          # 默认 3s，超时返回空候选
      filter: prefix       # prefix(默认): 按当前输入前缀过滤; none: 原样返回
      file_fallback: false # 无候选时是否回退到文件补全，默认 false
      no_space: false      # 选中后不追加空格，默认 false
